services:
  sonarqube:
    image: sonarqube:10.7.0-community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONARQUBE_JDBC_URL=jdbc:postgresql://db:5432/sonar
      - SONARQUBE_JDBC_USERNAME=sonar
      - SONARQUBE_JDBC_PASSWORD=sonar
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - ./sonarqube_extensions:/opt/sonarqube/extensions/plugins
    networks:
      - default
    restart: unless-stopped

  db:
    image: postgres:13
    container_name: sonarqube_db
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
      - POSTGRES_DB=sonar
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 10s
      timeout: 5s
      retries: 5

  sonar-scanner:
    image: sonarsource/sonar-scanner-cli
    container_name: sonar_scanner
    volumes:
      - ../creedengo-rust-test:/usr/src
    networks:
      - default
    depends_on:
      - sonarqube
    entrypoint: |
      /bin/bash -c "
      echo 'Listing files in /usr/src before running sonar-scanner:';
      ls -al /usr/src;
      echo 'Displaying content of sonar-project.properties:';
      cat /usr/src/sonar-project.properties;
      while ! nc -z sonarqube 9000; do
        echo 'Waiting for SonarQube to be available...';
        sleep 5;
      done;
      sonar-scanner -Dsonar.projectBaseDir=/usr/src"

volumes:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  postgres_data:

networks:
  default:
